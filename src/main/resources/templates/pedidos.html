<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Lista de Pedidos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bag me-2 text-primary"></i>Pedidos
        </h2>
        <a th:href="@{/pedidos/novo}" class="btn btn-primary" sec:authorize="hasAnyRole('GERENTE','ATENDENTE')">
            <i class="bi bi-plus-lg me-1"></i> Novo Pedido
        </a>
    </div>

    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div id="pedidos-alerta" class="alert d-none" role="alert"></div>

    <div class="card shadow-sm">
        <div class="card-body p-0 table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Pedido</th>
                        <th>Itens</th>
                        <th>Valores (R$)</th>
                        <th>Status</th>
                        <th>Entrada</th>
                        <th>Saída / Cancelamento</th>
                        <th class="text-end pe-4" sec:authorize="hasAnyRole('GERENTE','ATENDENTE')">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="7" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum pedido encontrado.
                        </td>
                    </tr>
                    <tr th:each="pedido : ${pedidos}">
                        <td class="ps-4">
                            <div class="fw-semibold" th:text="${nomesClientes[pedido.clienteId]} ?: 'Cliente não encontrado'"></div>
                            <div class="small text-muted" th:if="${pedido.tipoAtendimento != null}"
                                 th:text="${pedido.tipoAtendimento.descricao}"></div>
                            <code class="small text-muted" th:text="${pedido.id}"></code>
                        </td>

                        <td>
                            <ul class="list-unstyled small mb-0" th:unless="${#lists.isEmpty(pedido.itens)}">
                                <li th:each="item : ${pedido.itens}"
                                    th:text="${item.quantidade + 'x ' + item.nomeProduto + ' — ' + #numbers.formatDecimal(item.precoUnitario, 1, 'POINT', 2, 'COMMA')}"></li>
                            </ul>
                            <span class="small text-muted" th:if="${#lists.isEmpty(pedido.itens)}"
                                  th:text="'(legado) ' + (${pedido.quantidade} ?: '') + ' ' + (${pedido.tipoPizza} ?: '') + ' ' + (${pedido.sabor} ?: '')"></span>
                        </td>

                        <td class="small">
                            <th:block th:if="${pedido.valorTotal != null}">
                                <div>Bruto: <span th:text="${#numbers.formatDecimal(pedido.valorBruto, 1, 'POINT', 2, 'COMMA')}"></span></div>
                                <div th:if="${pedido.percentualDesconto != null}" class="text-success">
                                    Desconto: <span th:text="${#numbers.formatDecimal(pedido.percentualDesconto, 1, 'POINT', 2, 'COMMA')} + '%'"></span>
                                </div>
                                <div class="fw-bold">Total: <span th:text="${#numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 2, 'COMMA')}"></span></div>
                            </th:block>
                            <span class="text-muted" th:if="${pedido.valorTotal == null}">—</span>
                        </td>

                        <td>
                            <span class="badge" th:if="${pedido.status != null}"
                                  th:classappend="${pedido.status.name() == 'RECEBIDO'} ? 'bg-secondary' :
                                                  (${pedido.status.name() == 'EM_PREPARACAO'} ? 'bg-warning text-dark' :
                                                  (${pedido.status.name() == 'PRONTO'} ? 'bg-info text-dark' :
                                                  (${pedido.status.name() == 'CANCELADO'} ? 'bg-danger' :
                                                  (${pedido.status.name() == 'FINALIZADO'} ? 'bg-success' : 'bg-primary'))))"
                                  th:text="${pedido.status.descricao}"></span>
                            <details class="small mt-1" th:unless="${#lists.isEmpty(pedido.historicoStatus)}">
                                <summary class="text-muted">Histórico</summary>
                                <ul class="list-unstyled mb-0">
                                    <li th:each="h : ${pedido.historicoStatus}"
                                        th:text="${#temporals.format(h.dataHora, 'dd/MM HH:mm')} + ' · ' + ${h.status.descricao} + ' · ' + ${h.usuario}"></li>
                                </ul>
                            </details>
                        </td>

                        <td class="small">
                            <th:block th:if="${pedido.dataEntrada != null}">
                                <div th:text="${#temporals.format(pedido.dataEntrada, 'dd/MM/yyyy HH:mm')}"></div>
                                <div class="text-muted" th:text="'por ' + ${pedido.criadoPor}"></div>
                            </th:block>
                            <span class="text-muted" th:if="${pedido.dataEntrada == null}">—</span>
                        </td>

                        <td class="small">
                            <th:block th:if="${pedido.dataSaida != null}">
                                <div th:text="${#temporals.format(pedido.dataSaida, 'dd/MM/yyyy HH:mm')}"></div>
                                <div class="text-muted" th:text="'por ' + ${pedido.responsavelSaida}"></div>
                            </th:block>
                            <th:block th:if="${pedido.cancelado}">
                                <div class="text-danger" th:text="'Cancelado em ' + ${#temporals.format(pedido.dataCancelamento, 'dd/MM/yyyy HH:mm')} + ' por ' + ${pedido.canceladoPor}"></div>
                                <div class="fst-italic" th:text="${pedido.justificativaCancelamento}"></div>
                            </th:block>
                            <span class="text-muted" th:if="${pedido.dataSaida == null and !pedido.cancelado}">—</span>
                        </td>

                        <td class="text-end pe-4 text-nowrap" sec:authorize="hasAnyRole('GERENTE','ATENDENTE')">
                            <button type="button" class="btn btn-sm btn-outline-primary mb-1"
                                    th:each="proximo : ${proximosStatus[pedido.id]}"
                                    data-acao="status"
                                    th:attr="data-pedido=${pedido.id},data-status=${proximo.name()}"
                                    th:text="'→ ' + ${proximo.descricao}"></button>
                            <th:block sec:authorize="hasRole('GERENTE')">
                                <th:block th:if="${pedido.status != null and pedido.status.antesDaSaida}">
                                    <button type="button" class="btn btn-sm btn-outline-success mb-1" data-acao="desconto"
                                            th:if="${pedido.valorBruto != null}"
                                            th:attr="data-pedido=${pedido.id}">
                                        <i class="bi bi-percent"></i> Desconto
                                    </button>
                                    <button type="button" class="btn btn-sm btn-outline-danger mb-1" data-acao="cancelar"
                                            th:attr="data-pedido=${pedido.id}">
                                        <i class="bi bi-x-circle"></i> Cancelar
                                    </button>
                                </th:block>
                            </th:block>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(pedidos)}">
            Total: <strong th:text="${#lists.size(pedidos)}"></strong> pedido(s)
        </div>
    </div>

    <th:block sec:authorize="hasRole('GERENTE')">
        <div class="modal fade" id="modal-cancelar" tabindex="-1" aria-labelledby="titulo-cancelar" aria-hidden="true">
            <div class="modal-dialog">
                <form class="modal-content" id="form-cancelar">
                    <div class="modal-header">
                        <h5 class="modal-title" id="titulo-cancelar">Cancelar pedido</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    </div>
                    <div class="modal-body">
                        <label for="justificativa" class="form-label">Justificativa (obrigatória)</label>
                        <textarea id="justificativa" class="form-control" rows="3" maxlength="500" required></textarea>
                        <div class="text-danger small mt-2 d-none" data-erro></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Voltar</button>
                        <button type="submit" class="btn btn-danger">Confirmar cancelamento</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="modal fade" id="modal-desconto" tabindex="-1" aria-labelledby="titulo-desconto" aria-hidden="true">
            <div class="modal-dialog modal-sm">
                <form class="modal-content" id="form-desconto">
                    <div class="modal-header">
                        <h5 class="modal-title" id="titulo-desconto">Aplicar desconto</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    </div>
                    <div class="modal-body">
                        <label for="percentual" class="form-label">Percentual (até 20%)</label>
                        <div class="input-group">
                            <input type="number" id="percentual" class="form-control" step="0.01" required>
                            <span class="input-group-text">%</span>
                        </div>
                        <div class="form-text">Substitui o desconto anterior. O total é recalculado no servidor.</div>
                        <div class="text-danger small mt-2 d-none" data-erro></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Voltar</button>
                        <button type="submit" class="btn btn-success">Aplicar</button>
                    </div>
                </form>
            </div>
        </div>
    </th:block>

    <th:block sec:authorize="hasAnyRole('GERENTE','ATENDENTE')">
        <script>
            (() => {
                const alerta = document.getElementById('pedidos-alerta');
                let pedidoSelecionado = null;

                function mostrarErro(destino, mensagem) {
                    destino.textContent = mensagem;
                    destino.classList.remove('d-none');
                    if (destino === alerta) {
                        alerta.classList.add('alert-danger');
                    }
                }

                function urlPedido(id, sufixo) {
                    return '/api/pedidos/' + encodeURIComponent(id) + sufixo;
                }

                // Avançar status
                document.querySelectorAll('[data-acao="status"]').forEach(botao => {
                    botao.addEventListener('click', async () => {
                        botao.disabled = true;
                        try {
                            const status = encodeURIComponent(botao.dataset.status);
                            await PediuPatrao.enviar('PUT', urlPedido(botao.dataset.pedido, '/status?status=' + status));
                            location.reload();
                        } catch (e) {
                            mostrarErro(alerta, e.message);
                            botao.disabled = false;
                        }
                    });
                });

                // Abrir modais
                function abrirModal(idModal) {
                    return botao => botao.addEventListener('click', () => {
                        pedidoSelecionado = botao.dataset.pedido;
                        const modal = document.getElementById(idModal);
                        modal.querySelector('form').reset();
                        modal.querySelector('[data-erro]').classList.add('d-none');
                        bootstrap.Modal.getOrCreateInstance(modal).show();
                    });
                }
                document.querySelectorAll('[data-acao="cancelar"]').forEach(abrirModal('modal-cancelar'));
                document.querySelectorAll('[data-acao="desconto"]').forEach(abrirModal('modal-desconto'));

                // Confirmar cancelamento (só existe para o GERENTE)
                const formCancelar = document.getElementById('form-cancelar');
                if (formCancelar) {
                    formCancelar.addEventListener('submit', async evento => {
                        evento.preventDefault();
                        const form = evento.target;
                        try {
                            await PediuPatrao.enviar('POST', urlPedido(pedidoSelecionado, '/cancelar'),
                                { justificativa: document.getElementById('justificativa').value });
                            location.reload();
                        } catch (e) {
                            mostrarErro(form.querySelector('[data-erro]'), e.message);
                        }
                    });
                }

                // Aplicar desconto (só existe para o GERENTE; o valor vai como texto para não perder precisão)
                const formDesconto = document.getElementById('form-desconto');
                if (formDesconto) {
                    formDesconto.addEventListener('submit', async evento => {
                        evento.preventDefault();
                        const form = evento.target;
                        try {
                            await PediuPatrao.enviar('POST', urlPedido(pedidoSelecionado, '/desconto'),
                                { percentual: document.getElementById('percentual').value });
                            location.reload();
                        } catch (e) {
                            mostrarErro(form.querySelector('[data-erro]'), e.message);
                        }
                    });
                }
            })();
        </script>
    </th:block>

</div>

</body>
</html>
