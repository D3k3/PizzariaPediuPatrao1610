<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Novo Pedido</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex align-items-center gap-3 mb-4">
        <a th:href="@{/pedidos}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="fw-bold mb-0">Novo Pedido</h2>
    </div>

    <div class="alert alert-danger" th:if="${erro}" role="alert" style="max-width: 760px;">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
    </div>
    <div class="alert alert-warning" th:if="${#lists.isEmpty(clientes) or #lists.isEmpty(produtos)}" style="max-width: 760px;">
        É preciso ter ao menos um cliente e um produto ativo cadastrados para registrar um pedido.
    </div>

    <div class="card shadow-sm" style="max-width: 760px;">
        <div class="card-body p-4">

            <form th:action="@{/pedidos/salvar}" th:object="${pedidoForm}" method="post" id="form-pedido">
                <div class="row mb-3">
                    <div class="col-md-8">
                        <label for="clienteId" class="form-label fw-medium">Cliente</label>
                        <select id="clienteId" class="form-select" th:field="*{clienteId}" required>
                            <option value="">Selecione o cliente</option>
                            <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nome}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <span class="form-label fw-medium d-block mb-2">Atendimento</span>
                        <div class="form-check form-check-inline" th:each="t : ${tipos}">
                            <input class="form-check-input" type="radio" th:field="*{tipoAtendimento}" th:value="${t}" required>
                            <label class="form-check-label" th:for="${#ids.prev('tipoAtendimento')}" th:text="${t.descricao}"></label>
                        </div>
                    </div>
                </div>

                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th style="width: 120px;">Quantidade</th>
                            <th style="width: 60px;"></th>
                        </tr>
                    </thead>
                    <tbody id="itens">
                        <tr th:each="item, st : *{itens}" data-item>
                            <td>
                                <select class="form-select" th:field="*{itens[__${st.index}__].produtoId}" required>
                                    <option value="">Selecione</option>
                                    <option th:each="p : ${produtos}" th:value="${p.id}"
                                            th:text="${p.nome + ' — R$ ' + #numbers.formatDecimal(p.preco, 1, 'POINT', 2, 'COMMA')}"></option>
                                </select>
                            </td>
                            <td>
                                <input type="number" class="form-control" min="1" max="100" step="1"
                                       th:field="*{itens[__${st.index}__].quantidade}" required>
                            </td>
                            <td>
                                <button type="button" class="btn btn-outline-danger btn-sm" data-remover title="Remover item">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <template id="modelo-item">
                    <tr data-item>
                        <td>
                            <select class="form-select" data-campo="produtoId" required>
                                <option value="">Selecione</option>
                                <option th:each="p : ${produtos}" th:value="${p.id}"
                                        th:text="${p.nome + ' — R$ ' + #numbers.formatDecimal(p.preco, 1, 'POINT', 2, 'COMMA')}"></option>
                            </select>
                        </td>
                        <td><input type="number" class="form-control" min="1" max="100" step="1" data-campo="quantidade" required></td>
                        <td>
                            <button type="button" class="btn btn-outline-danger btn-sm" data-remover title="Remover item">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                </template>

                <div class="d-flex justify-content-between">
                    <button type="button" class="btn btn-outline-secondary" id="adicionar-item">
                        <i class="bi bi-plus-lg me-1"></i> Adicionar item
                    </button>
                    <div class="d-flex gap-2">
                        <a th:href="@{/pedidos}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i> Registrar pedido
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        (() => {
            const corpo = document.getElementById('itens');
            let proximoIndice = corpo.querySelectorAll('[data-item]').length;

            document.getElementById('adicionar-item').addEventListener('click', () => {
                const linha = document.getElementById('modelo-item').content.firstElementChild.cloneNode(true);
                linha.querySelectorAll('[data-campo]').forEach(campo => {
                    campo.name = 'itens[' + proximoIndice + '].' + campo.dataset.campo;
                });
                proximoIndice++;
                corpo.appendChild(linha);
            });

            corpo.addEventListener('click', evento => {
                const botao = evento.target.closest('[data-remover]');
                if (botao && corpo.querySelectorAll('[data-item]').length > 1) {
                    botao.closest('[data-item]').remove();
                }
            });
        })();
    </script>
</div>
</body>
</html>
